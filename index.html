<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>拍照看營養</title>

  <!-- PWA / iOS 全螢幕設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="拍照看營養" />
  <meta name="theme-color" content="#FBF6E3" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-180.png" />

  <!-- React 18 + Babel(單檔部署,免建置)
       全部自行託管於 vendor/,不從 CDN 載入:
       API key 存在 localStorage,任何一個 CDN 被入侵都能讀走它。
       附帶好處是斷網也能開(PWA 該有的行為)。
       版本: React 18.3.1 / Babel standalone 7.26.2 / Tailwind Play CDN -->
  <script src="./vendor/react.production.min.js"></script>
  <script src="./vendor/react-dom.production.min.js"></script>
  <script src="./vendor/babel.min.js"></script>
  <!-- Tailwind(沿用原本的 className 寫法) -->
  <script src="./vendor/tailwind.min.js"></script>

  <style>
    html, body { margin: 0; padding: 0; background: #FBF6E3; }
    /* iOS 加入主畫面後的安全區域 */
    body { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    // ============================================================
    // window.storage 相容層(取代 Claude artifact 專用 API)
    // 介面完全相同,底層改用 localStorage,app 程式碼幾乎不用改
    // ============================================================
    window.storage = {
      async get(key) {
        const value = localStorage.getItem("app:" + key);
        if (value === null) throw new Error("key not found: " + key);
        return { key, value };
      },
      async set(key, value) {
        localStorage.setItem("app:" + key, value);
        return { key, value };
      },
      async delete(key) {
        localStorage.removeItem("app:" + key);
        return { key, deleted: true };
      },
    };
  </script>

  <script type="text/babel" data-presets="react">
    const { useState, useRef, useEffect } = React;

    // 拍照看營養 — 飲食日記 + 月曆版(GitHub Pages 部署版)
    // 與 artifact 版差異:
    // 1. 儲存改用 localStorage(上方相容層)
    // 2. API 改為「使用者自帶金鑰」:第一次使用時輸入,存在自己手機
    // 3. 加上 PWA 設定,加入主畫面後全螢幕運作

    const T = {
      bg: "#FBF6E3",
      card: "#FFFFFF",
      brown: "#4A342A",
      lightBrown: "#8A6F5C",
      orange: "#F08C3A",
      teal: "#2F9E8F",
      yellow: "#E2B93B",
      red: "#B85462",
      track: "#EFE9D8",
      green: "#5FA05A",
    };

    const MEALS = [
      { id: "breakfast", label: "早餐", icon: "🌅" },
      { id: "lunch", label: "午餐", icon: "☀️" },
      { id: "dinner", label: "晚餐", icon: "🌇" },
      { id: "snack", label: "小食/其他", icon: "🌙" },
    ];

    const WEEKDAYS = ["一", "二", "三", "四", "五", "六", "日"];
    const API_KEY_STORAGE = "anthropic_api_key";
    // 雲端同步網址(選填;沒填就完全不同步,行為跟舊版一樣)
    const SYNC_URL_STORAGE = "sync_url";
    // 每日營養目標(可在設定頁自訂;沒設定就用預設值)
    const GOALS_STORAGE = "daily_goals";
    const DEFAULT_GOALS = { kcal: 2000, carbs: 250, protein: 60, fat: 65 };
    const loadGoals = () => {
      try {
        return { ...DEFAULT_GOALS, ...JSON.parse(localStorage.getItem(GOALS_STORAGE) || "{}") };
      } catch {
        return { ...DEFAULT_GOALS };
      }
    };

    // ---------- 依目標與今天的訓練算營養目標（與教練電腦端 nutrition_plan.py 同一套公式）----------
    // 基礎代謝：Katch-McArdle（370 ＋ 21.6 × 去脂體重）；活動係數已用手錶實際消耗校正（打九折）
    const PLAN_ACTIVITY = { "休息": 1.30, "重訓": 1.42, "上課": 1.65, "騎車": 1.30 };
    const RIDE_KCAL_PER_HOUR = 550;
    const PLAN_GOALS = {
      "減脂": { adj: { "休息": -0.20, "重訓": -0.15, "上課": -0.10, "騎車": -0.05 }, protein: 2.2, fat: 0.8 },
      "備賽": { adj: { "休息": -0.05, "重訓": -0.05, "上課": 0, "騎車": 0 }, protein: 1.9, fat: 0.9 },
      "維持": { adj: { "休息": 0, "重訓": 0, "上課": 0, "騎車": 0 }, protein: 1.8, fat: 0.9 },
      "增肌": { adj: { "休息": 0.05, "重訓": 0.12, "上課": 0.08, "騎車": 0.08 }, protein: 2.0, fat: 1.0 },
    };
    const calcPlan = (weight, bf, goal, day, hours) => {
      const lbm = bf > 0 ? weight * (1 - bf / 100) : weight * 0.82;
      const burn = (370 + 21.6 * lbm) * PLAN_ACTIVITY[day] + (day === "騎車" ? RIDE_KCAL_PER_HOUR * (hours || 0) : 0);
      const g = PLAN_GOALS[goal];
      let kcal = burn * (1 + g.adj[day]);
      const protein = weight * g.protein;
      let fat = weight * g.fat;
      let carbs = (kcal - protein * 4 - fat * 9) / 4;
      // 騎車日碳水至少每公斤 5 g；碳水上限每公斤 10 g，超出改由脂肪補
      if (day === "騎車" && carbs < weight * 5) {
        carbs = weight * 5;
        kcal = protein * 4 + fat * 9 + carbs * 4;
      }
      if (carbs > weight * 10) {
        fat += (carbs - weight * 10) * 4 / 9;
        carbs = weight * 10;
      }
      const r10 = (x) => Math.round(x / 10) * 10;
      return { kcal: r10(kcal), carbs: r10(carbs), protein: r10(protein), fat: Math.round(fat / 5) * 5 };
    };

    // 同步時不送縮圖,只送數字與文字
    const stripThumbs = (log) => {
      const out = {};
      Object.keys(log || {}).forEach((meal) => {
        // 縮圖與原始估算（baseItems）只留在手機，不上傳
        out[meal] = (log[meal] || []).map(({ thumb, baseItems, ...rest }) => rest);
      });
      return out;
    };

    // 送到 Google Apps Script。用 text/plain 避開跨網域預檢；讀回應確認真的寫進去，20 秒沒回就算失敗
    const postSync = async (url, payload) => {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 20000);
      try {
        const r = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload),
          signal: ctrl.signal,
        });
        const j = await r.json();
        if (!j.ok) throw new Error(j.error || "接收端拒絕");
        return j;
      } catch (e) {
        throw new Error(e.name === "AbortError" ? "逾時" : e.message);
      } finally {
        clearTimeout(timer);
      }
    };

    // 還沒成功上傳的日期（手機關掉 App、沒網路時送不出去，下次打開會自動補送）
    const PENDING_KEY = "sync_pending";
    const SYNC_STATUS_KEY = "sync_status";
    const loadPending = () => { try { return JSON.parse(localStorage.getItem(PENDING_KEY) || "[]"); } catch { return []; } };

    const round1 = (n) => Math.round((Number(n) || 0) * 10) / 10;
    const pad2 = (x) => String(x).padStart(2, "0");
    const dateStrOf = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
    const todayStr = () => dateStrOf(new Date());

    const emptyLog = () => ({ breakfast: [], lunch: [], dinner: [], snack: [] });

    const sumItems = (items) =>
      (items || []).reduce(
        (a, i) => ({
          cal: a.cal + (Number(i.calories) || 0),
          carbs: a.carbs + (Number(i.carbs_g) || 0),
          protein: a.protein + (Number(i.protein_g) || 0),
          fat: a.fat + (Number(i.fat_g) || 0),
        }),
        { cal: 0, carbs: 0, protein: 0, fat: 0 }
      );

    const dayCalOf = (log) =>
      Math.round(
        sumItems(
          MEALS.flatMap((m) => (log[m.id] || []).flatMap((e) => e.items || []))
        ).cal
      );

    function Donut({ value, fraction, label, color }) {
      const r = 26;
      const c = 2 * Math.PI * r;
      const f = Math.max(0, Math.min(1, fraction || 0));
      return (
        <div className="flex flex-col items-center" style={{ minWidth: 72 }}>
          <div style={{ position: "relative", width: 72, height: 72 }}>
            <svg width="72" height="72" viewBox="0 0 72 72">
              <circle cx="36" cy="36" r={r} fill="none" stroke={T.track} strokeWidth="8" />
              <circle cx="36" cy="36" r={r} fill="none"
                stroke={color} strokeWidth="8" strokeLinecap="round"
                strokeDasharray={`${c * f} ${c * (1 - f)}`}
                transform="rotate(-90 36 36)" />
            </svg>
            <div className="flex items-center justify-center"
              style={{ position: "absolute", inset: 0, fontWeight: 800, color: T.brown, fontSize: 15 }}>
              {Math.round(value) || 0}
            </div>
          </div>
          <div className="text-xs mt-1" style={{ color: T.brown, fontWeight: 700 }}>{label}</div>
        </div>
      );
    }

    function FoodDiary() {
      const [view, setView] = useState("diary"); // diary | capture | calendar | settings
      const [selectedDate, setSelectedDate] = useState(todayStr());
      const [activeMeal, setActiveMeal] = useState(null);
      const [dayLog, setDayLog] = useState(emptyLog());
      const [storageReady, setStorageReady] = useState(false);
      const [expandedId, setExpandedId] = useState(null);
      const [summary, setSummary] = useState({}); // { "YYYY-MM-DD": kcal }
      const [calMonth, setCalMonth] = useState(() => {
        const d = new Date();
        return new Date(d.getFullYear(), d.getMonth(), 1);
      });

      // API 金鑰(每個使用者自己輸入,只存在自己手機的 localStorage)
      const [apiKey, setApiKey] = useState(() => localStorage.getItem(API_KEY_STORAGE) || "");
      const [keyInput, setKeyInput] = useState("");

      // 雲端同步與每日目標
      const [syncUrl, setSyncUrl] = useState(() => localStorage.getItem(SYNC_URL_STORAGE) || "");
      const [syncInput, setSyncInput] = useState("");
      const [syncMsg, setSyncMsg] = useState("");
      const [pending, setPending] = useState(loadPending);
      const [syncStatus, setSyncStatus] = useState(() => { try { return JSON.parse(localStorage.getItem(SYNC_STATUS_KEY) || "null"); } catch { return null; } });
      const [goals, setGoals] = useState(loadGoals);
      const [goalInput, setGoalInput] = useState(loadGoals);
      const DAILY_GOAL = goals.kcal;
      // 教練推送的今日目標說明（例如「減脂・休息（2026-10-21）」）
      const [goalLabel, setGoalLabel] = useState(() => localStorage.getItem("daily_goals_label") || "");

      // 身體資料與目標選擇（存在手機）
      const loadJSON = (k, d) => { try { return { ...d, ...JSON.parse(localStorage.getItem(k) || "{}") }; } catch { return d; } };
      const [body, setBody] = useState(() => loadJSON("body_profile", { weight: "", bf: "" }));
      const [bodyInput, setBodyInput] = useState(() => loadJSON("body_profile", { weight: "", bf: "" }));
      const [plan, setPlan] = useState(() => loadJSON("goal_plan", { goal: "維持", day: "休息", hours: 2 }));
      const [planMsg, setPlanMsg] = useState("");

      // 依選的目標重算，並記下「今天是我自己選的」，教練推送就不會蓋掉
      const applyPlan = (p, b = body) => {
        setPlan(p);
        localStorage.setItem("goal_plan", JSON.stringify(p));
        const w = Number(b.weight);
        if (!(w > 0)) {
          setPlanMsg("先到 ⚙️ 設定填體重,才能幫你算");
          return;
        }
        setPlanMsg("");
        const next = calcPlan(w, Number(b.bf) || 0, p.goal, p.day, Number(p.hours) || 0);
        const label = `${p.goal}・${p.day}${p.day === "騎車" ? ` ${p.hours} 小時` : ""}`;
        localStorage.setItem(GOALS_STORAGE, JSON.stringify(next));
        localStorage.setItem("daily_goals_label", label);
        localStorage.setItem("goals_manual_date", todayStr());
        setGoals(next);
        setGoalInput(next);
        setGoalLabel(label);
      };

      const saveBody = () => {
        const b = { weight: bodyInput.weight, bf: bodyInput.bf };
        localStorage.setItem("body_profile", JSON.stringify(b));
        setBody(b);
        applyPlan(plan, b);
      };

      const savePending = (list) => {
        localStorage.setItem(PENDING_KEY, JSON.stringify(list));
        setPending(list);
      };
      const markStatus = (ok, msg) => {
        const s = { ok, msg, time: new Date().toLocaleString("zh-TW", { hour12: false }) };
        localStorage.setItem(SYNC_STATUS_KEY, JSON.stringify(s));
        setSyncStatus(s);
      };

      // 把待上傳的日期一次送出（每批 20 天）；成功的從佇列拿掉
      const flushing = useRef(false);
      const flushPending = async (extraDates = []) => {
        const url = localStorage.getItem(SYNC_URL_STORAGE);
        if (!url || flushing.current) return null;
        const dates = [...new Set([...loadPending(), ...extraDates])].sort();
        if (!dates.length) return 0;
        flushing.current = true;
        savePending(dates);
        let sent = 0;
        try {
          for (let i = 0; i < dates.length; i += 20) {
            const batch = dates.slice(i, i + 20);
            const days = batch.map((d) => {
              let log = emptyLog();
              try { log = JSON.parse(localStorage.getItem("app:log:" + d)) || log; } catch {}
              return { date: d, log: stripThumbs(log) };
            });
            await postSync(url, { days });
            sent += batch.length;
            savePending(loadPending().filter((d) => !batch.includes(d)));
          }
          markStatus(true, `已上傳 ${sent} 天`);
        } catch (e) {
          markStatus(false, `上傳失敗（${e.message}），還有 ${loadPending().length} 天等著補送`);
        } finally {
          flushing.current = false;
        }
        return sent;
      };

      // 打開 App、從背景切回來、恢復網路時，自動補送沒送成功的
      useEffect(() => {
        if (!syncUrl) return;
        flushPending();
        const onVisible = () => { if (document.visibilityState === "visible") flushPending(); };
        document.addEventListener("visibilitychange", onVisible);
        window.addEventListener("online", onVisible);
        return () => {
          document.removeEventListener("visibilitychange", onVisible);
          window.removeEventListener("online", onVisible);
        };
      }, [syncUrl]);

      // 有開雲端同步時，打開 App（或從背景切回來）就讀一次教練推送的目標
      useEffect(() => {
        if (!syncUrl) return;
        const load = async () => {
          try {
            const sep = syncUrl.includes("?") ? "&" : "?";
            const r = await fetch(`${syncUrl}${sep}action=goals`);
            const j = await r.json();
            const g = j && j.ok && j.goals;
            if (!g || !(g.kcal > 0)) return;
            // 今天已經在 App 上自己選過目標，就以自己選的為準
            if (localStorage.getItem("goals_manual_date") === todayStr()) return;
            const next = { kcal: g.kcal, carbs: g.carbs, protein: g.protein, fat: g.fat };
            localStorage.setItem(GOALS_STORAGE, JSON.stringify(next));
            // 今天的目標只顯示說明；不是今天推的才標日期，提醒教練還沒更新
            const label = g.label ? `${g.label}${g.date && g.date !== todayStr() ? `（${g.date.slice(5)}）` : ""}` : "";
            localStorage.setItem("daily_goals_label", label);
            setGoals(next);
            setGoalInput(next);
            setGoalLabel(label);
          } catch {
            // 離線或同步網址失效：沿用手機上的目標
          }
        };
        load();
        const onVisible = () => { if (document.visibilityState === "visible") load(); };
        document.addEventListener("visibilitychange", onVisible);
        return () => document.removeEventListener("visibilitychange", onVisible);
      }, [syncUrl]);

      const [imageData, setImageData] = useState(null);
      const [previewUrl, setPreviewUrl] = useState(null);
      const [thumb, setThumb] = useState(null);
      const [loading, setLoading] = useState(false);
      const [converting, setConverting] = useState(false);
      const [result, setResult] = useState(null);
      const [saved, setSaved] = useState(false);
      const [error, setError] = useState(null);
      // 沒拍到照片的記錄方式：db 資料庫／recent 吃過的／text 打字讓 AI 估
      const [manualTab, setManualTab] = useState(null);
      const [foodDb, setFoodDb] = useState(null);
      const [foodQuery, setFoodQuery] = useState("");
      const [pickedFood, setPickedFood] = useState(null);
      const [pickAmount, setPickAmount] = useState("100");
      const [pickUnit, setPickUnit] = useState("g");
      const [pickSweet, setPickSweet] = useState(0);
      const [textDesc, setTextDesc] = useState("");
      const cameraRef = useRef(null);
      const galleryRef = useRef(null);

      const isToday = selectedDate === todayStr();
      const storageKey = `log:${selectedDate}`;

      // 載入每日總結索引(月曆用,一次讀取)
      useEffect(() => {
        (async () => {
          try {
            const r = await window.storage.get("summary");
            if (r && r.value) setSummary(JSON.parse(r.value));
          } catch {
            // 尚無索引
          }
        })();
      }, []);

      // 載入選定日期的紀錄
      useEffect(() => {
        let cancelled = false;
        setStorageReady(false);
        setDayLog(emptyLog());
        (async () => {
          let loaded = emptyLog();
          try {
            const r = await window.storage.get(storageKey);
            if (r && r.value) loaded = { ...emptyLog(), ...JSON.parse(r.value) };
          } catch {
            // 該日尚無紀錄
          }
          if (!cancelled) {
            setDayLog(loaded);
            setStorageReady(true);
            syncSummary(selectedDate, dayCalOf(loaded));
          }
        })();
        return () => { cancelled = true; };
      }, [selectedDate]);

      // 更新每日總結索引
      const syncSummary = async (dateStr, cal) => {
        setSummary((prev) => {
          const cur = prev[dateStr] || 0;
          if (cur === cal && (cal !== 0 || dateStr in prev)) return prev;
          const next = { ...prev };
          if (cal > 0) next[dateStr] = cal;
          else delete next[dateStr];
          window.storage.set("summary", JSON.stringify(next)).catch(() => {});
          return next;
        });
      };

      const persist = async (next) => {
        setDayLog(next);
        try {
          await window.storage.set(storageKey, JSON.stringify(next));
        } catch {
          setError("紀錄儲存失敗,可能是儲存空間已滿。可刪除較舊的紀錄後再試。");
        }
        syncSummary(selectedDate, dayCalOf(next));
        // 有設定同步網址才送出;送整天的紀錄,刪除也會跟著同步
        if (syncUrl) {
          savePending([...new Set([...loadPending(), selectedDate])]);
          flushPending();
        }
      };

      // ---------- 雲端同步管理 ----------
      const saveSyncUrl = () => {
        const u = syncInput.trim();
        if (!u) {
          setSyncMsg("先把同步網址貼到上面的框框,再按「開啟同步」");
          return;
        }
        if (!/^https:\/\/script\.google\.com\/.+key=/.test(u)) {
          setSyncMsg("網址看起來不對:要是 https://script.google.com/ 開頭、含 key= 的完整網址");
          return;
        }
        localStorage.setItem(SYNC_URL_STORAGE, u);
        setSyncUrl(u);
        setSyncInput("");
        setSyncMsg("");
      };

      const clearSyncUrl = () => {
        localStorage.removeItem(SYNC_URL_STORAGE);
        setSyncUrl("");
        setSyncMsg("");
      };

      const testSync = async () => {
        setSyncMsg("測試中…");
        try {
          const sep = syncUrl.includes("?") ? "&" : "?";
          const ctrl = new AbortController();
          setTimeout(() => ctrl.abort(), 15000);
          const r = await fetch(`${syncUrl}${sep}action=ping`, { signal: ctrl.signal });
          const j = await r.json();
          setSyncMsg(j.ok ? "✓ 連線成功" : `連線失敗:${j.error || "未知錯誤"}`);
        } catch (e) {
          setSyncMsg(`連線失敗(${e.message})`);
        }
      };

      // 把手機裡所有舊紀錄一次補傳(每批 20 天)
      const backfillSync = async () => {
        const days = [];
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (!k || !k.startsWith("app:log:")) continue;
          try {
            days.push({ date: k.slice(8), log: stripThumbs(JSON.parse(localStorage.getItem(k))) });
          } catch {}
        }
        if (!days.length) {
          setSyncMsg("手機裡沒有舊紀錄可補傳");
          return;
        }
        setSyncMsg(`補傳中…(共 ${days.length} 天)`);
        const sent = await flushPending(days.map((d) => d.date));
        const left = loadPending().length;
        setSyncMsg(left ? `補傳失敗,還有 ${left} 天沒送出,稍後會自動再試` : `✓ 已上傳 ${sent} 天的紀錄`);
      };

      const saveGoals = () => {
        const g = {};
        Object.keys(DEFAULT_GOALS).forEach((k) => {
          const v = Number(goalInput[k]);
          g[k] = v > 0 ? v : DEFAULT_GOALS[k];
        });
        localStorage.setItem(GOALS_STORAGE, JSON.stringify(g));
        setGoals(g);
        setGoalInput(g);
      };

      // ---------- API 金鑰管理 ----------
      const saveApiKey = () => {
        const k = keyInput.trim();
        if (!k) return;
        localStorage.setItem(API_KEY_STORAGE, k);
        setApiKey(k);
        setKeyInput("");
        setView("diary");
      };

      const clearApiKey = () => {
        localStorage.removeItem(API_KEY_STORAGE);
        setApiKey("");
      };

      // ---------- 照片處理 ----------
      const readAsDataUrl = (blob) =>
        new Promise((res, rej) => {
          const r = new FileReader();
          r.onload = () => res(r.result);
          r.onerror = () => rej(new Error("read failed"));
          r.readAsDataURL(blob);
        });

      const decodeImage = (dataUrl) =>
        new Promise((res, rej) => {
          const img = new Image();
          img.onload = () => res(img);
          img.onerror = () => rej(new Error("decode failed"));
          img.src = dataUrl;
        });

      const loadHeic2any = () =>
        new Promise((res, rej) => {
          if (window.heic2any) return res(window.heic2any);
          const s = document.createElement("script");
          // 自行託管（原本從 cdnjs 載入）：CDN 若被入侵，注入的腳本能讀到
          // localStorage 裡的 API key。相對路徑讓 GitHub Pages 的子路徑也能運作。
          s.src = "./vendor/heic2any.min.js";
          s.onload = () => res(window.heic2any);
          s.onerror = () => rej(new Error("heic2any load failed"));
          document.head.appendChild(s);
        });

      const scaleTo = (img, maxSide, quality) => {
        const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        return canvas.toDataURL("image/jpeg", quality);
      };

      const processFile = async (file) => {
        setError(null);
        setResult(null);
        setSaved(false);
        setConverting(true);
        try {
          let img;
          try {
            img = await decodeImage(await readAsDataUrl(file));
          } catch {
            const heic2any = await loadHeic2any();
            const jpegBlob = await heic2any({ blob: file, toType: "image/jpeg", quality: 0.85 });
            img = await decodeImage(
              await readAsDataUrl(Array.isArray(jpegBlob) ? jpegBlob[0] : jpegBlob)
            );
          }
          const dataUrl = scaleTo(img, 720, 0.7);
          setImageData(dataUrl.split(",")[1]);
          setPreviewUrl(dataUrl);
          setThumb(scaleTo(img, 120, 0.6));
        } catch {
          setError("這張照片無法讀取。備案:iPhone「設定 → 相機 → 格式」改「最相容」後重拍。");
        } finally {
          setConverting(false);
        }
      };

      // ---------- API ----------
      // GitHub Pages 版:使用者自帶金鑰,直連 Anthropic API
      const apiHeaders = () => ({
        "Content-Type": "application/json",
        "x-api-key": apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true",
      });

      // 營養估算的回覆格式（照片與文字描述共用）
      const NUTRI_JSON = `只回傳 JSON,不要任何其他文字、不要 markdown 圍欄。格式:
{
  "food_name": "餐點名稱(繁體中文)",
  "items": [
    { "emoji": "一個代表食材的emoji", "name": "食材名稱(繁體中文)", "grams": 數字, "unit": "g" 或 "ml",
      "calories": 數字, "carbs_g": 數字, "protein_g": 數字, "fat_g": 數字 }
  ],
  "confidence": "high" | "medium" | "low",
  "notes": "一句話說明估算依據或不確定之處(繁體中文)"
}
規則:items 依熱量由高至低排序,最多10項;單一食物(如一瓶飲料)items 就只有一項。
飲料、湯、牛奶等液體 unit 填 "ml",grams 欄位填毫升數;固體 unit 填 "g"。
含糖飲料要把糖單獨列成一項,名稱寫「糖」或「果糖」;有寫甜度(半糖、微糖…)就照甜度,沒寫就以全糖估。`;

      // 呼叫 Claude 估算營養，回傳解析好的 JSON；失敗時設定錯誤訊息並回傳 null
      const askClaude = async (content) => {
        const response = await fetch("https://api.anthropic.com/v1/messages", {
          method: "POST",
          headers: apiHeaders(),
          body: JSON.stringify({
            model: "claude-sonnet-4-6",
            max_tokens: 1500,
            messages: [{ role: "user", content }],
          }),
        });
        const raw = await response.text();
        let data;
        try {
          data = JSON.parse(raw);
        } catch {
          setError(`API 回應異常 (HTTP ${response.status}):${raw.slice(0, 120) || "(空白回覆)"}`);
          return null;
        }
        if (data.error) {
          if (response.status === 401) {
            setError("API 金鑰無效或已過期,請到「設定」重新輸入。");
          } else {
            setError(`API 錯誤:${data.error.message || JSON.stringify(data.error)}`);
          }
          return null;
        }
        const text = (data.content || []).map((i) => (i.type === "text" ? i.text : "")).join("");
        const start = text.indexOf("{");
        const end = text.lastIndexOf("}");
        if (start === -1 || end === -1) {
          setError(`AI 回覆格式異常:${text.slice(0, 120) || "(空白回覆)"}`);
          return null;
        }
        const parsed = JSON.parse(text.slice(start, end + 1));
        if (parsed.error) {
          setError(parsed.error);
          return null;
        }
        return parsed;
      };

      // 把一筆估算結果存進目前選的餐別（照片、文字、資料庫、吃過的都走這裡）
      const saveEntry = async (parsed, entryThumb) => {
        setResult(parsed);
        const entry = {
          id: `${Date.now()}`,
          time: new Date().toTimeString().slice(0, 5),
          food_name: parsed.food_name,
          items: parsed.items || [],
          confidence: parsed.confidence,
          notes: parsed.notes,
          thumb: entryThumb || null,
        };
        const next = { ...dayLog, [activeMeal]: [...(dayLog[activeMeal] || []), entry] };
        await persist(next);
        setSaved(true);
        setExpandedId(entry.id); // 回日記時這筆直接展開，方便調整份量
      };

      const runEstimate = async (content, entryThumb) => {
        if (!apiKey) {
          setView("settings");
          return;
        }
        setLoading(true);
        setError(null);
        setResult(null);
        try {
          const parsed = await askClaude(content);
          if (parsed) await saveEntry(parsed, entryThumb);
        } catch (e) {
          setError(`連線失敗(${e.message})。請確認網路正常、API 金鑰正確。`);
        } finally {
          setLoading(false);
        }
      };

      const analyze = () => {
        if (!imageData) return;
        return runEstimate([
          { type: "image", source: { type: "base64", media_type: "image/jpeg", data: imageData } },
          {
            type: "text",
            text: `你是營養分析師。請辨識照片中的食物,拆解成主要食材並估算營養。\n${NUTRI_JSON}\n如果照片中不是食物,回傳 {"error": "說明原因(繁體中文)"}。`,
          },
        ], thumb);
      };

      // 沒拍到照片：用文字描述讓 AI 估（連鎖店餐點也適用）
      const analyzeText = () => {
        const desc = textDesc.trim();
        if (!desc) return;
        return runEstimate([{
          type: "text",
          text: `你是營養分析師。使用者沒有拍照,只用文字描述了吃的東西:「${desc}」。
請依台灣常見份量估算(有寫品牌或連鎖店就依該店常見品項估),拆解成主要食材。描述裡有寫份量或容量就照寫的算。
${NUTRI_JSON}
如果描述的不是食物,回傳 {"error": "說明原因(繁體中文)"}。`,
        }]);
      };

      // ---------- 沒拍到照片：食物資料庫、吃過的 ----------
      const loadFoodDb = async () => {
        if (foodDb) return;
        try {
          const r = await fetch("foods.json");
          setFoodDb(await r.json());
        } catch {
          setError("食物資料庫載入失敗,請確認網路後再試。");
        }
      };

      const searchFoods = (q) => {
        const terms = q.trim().split(/\s+/).filter(Boolean);
        if (!foodDb || !terms.length) return [];
        const hits = foodDb.foods.filter((f) => {
          const hay = `${f[0]} ${f[1]} ${f[2]}`;
          return terms.every((w) => hay.includes(w));
        });
        // 名稱開頭就符合的排前面，再來是名稱短的
        hits.sort((a, b) => (b[0].startsWith(terms[0]) - a[0].startsWith(terms[0])) || a[0].length - b[0].length);
        return hits.slice(0, 30);
      };

      // 資料庫食物可選的單位。液體用毫升（依密度換成重量算營養），固體用克；
      // 杯／碗／湯匙是家用單位，「份」是食藥署資料附的每份重量
      const unitsFor = (f) => {
        const liquid = f[9] === 1;
        const density = /油/.test(f[0]) ? 0.92 : /乳|奶/.test(f[0]) ? 1.03 : 1.0;
        const list = [
          { k: "g", label: "克", weight: 1, show: "g" },
          { k: "ml", label: "毫升", weight: density, show: "ml", ml: 1 },
          { k: "cup", label: "杯（240 ml）", weight: 240 * density, show: "ml", ml: 240 },
          { k: "tbsp", label: "湯匙（15 ml）", weight: 15 * density, show: "ml", ml: 15 },
          liquid
            ? { k: "bowl", label: "碗（250 ml）", weight: 250 * density, show: "ml", ml: 250 }
            : { k: "bowl", label: "碗（約 200 g）", weight: 200, show: "g" },
        ];
        if (f[8] > 0) list.push({ k: "unit", label: `份（約 ${f[8]} g）`, weight: f[8], show: "g" });
        return list;
      };

      const pickFood = (f) => {
        setPickedFood(f);
        // 液體預設 250 ml，固體預設 100 g
        setPickUnit(f[9] === 1 ? "ml" : "g");
        setPickAmount(f[9] === 1 ? "250" : "100");
        setPickSweet(0); // 資料庫的茶、奶多是無糖原料，預設無糖
      };

      // 依選的數量與單位算出：實際重量（算營養用）、顯示用的數字與單位
      const pickResult = () => {
        const f = pickedFood;
        const amt = Number(pickAmount);
        if (!f || !(amt > 0)) return null;
        const u = unitsFor(f).find((x) => x.k === pickUnit) || unitsFor(f)[0];
        const weight = amt * u.weight;
        const k = weight / 100;
        return {
          shown: u.show === "ml" ? Math.round(amt * u.ml) : Math.round(weight * 10) / 10,
          unit: u.show,
          kcal: Math.round(f[4] * k),
          carbs: Math.round(f[5] * k * 10) / 10,
          protein: Math.round(f[6] * k * 10) / 10,
          fat: Math.round(f[7] * k * 10) / 10,
        };
      };

      const addFromDb = async () => {
        const f = pickedFood;
        const r = pickResult();
        if (!f || !r) return;
        setError(null);
        const base = [{
          emoji: "🍽️", name: f[0] + (f[3] ? `(${f[3].split(/[,，]/)[0]})` : ""),
          grams: r.shown, unit: r.unit,
          calories: r.kcal, carbs_g: r.carbs, protein_g: r.protein, fat_g: r.fat,
        }];
        await saveEntry({
          food_name: f[0] + (r.unit === "ml" && pickSweet > 0
            ? `（${(SWEETNESS.find(([v]) => v === pickSweet) || [0, ""])[1]}）` : ""),
          items: r.unit === "ml" ? withSweetness(base, pickSweet) : base,
          confidence: "high",
          notes: "食藥署食品營養成分資料庫,依輸入份量換算",
        });
      };

      // 從手機裡的舊紀錄整理「吃過的」：依次數多寡排序
      const recentFoods = () => {
        const map = {};
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (!k || !k.startsWith("app:log:")) continue;
          let log;
          try { log = JSON.parse(localStorage.getItem(k)); } catch { continue; }
          MEALS.forEach((m) => (log[m.id] || []).forEach((e) => {
            if (!e.food_name || !(e.items || []).length) return;
            const cur = map[e.food_name] || { count: 0, last: "", entry: e };
            cur.count += 1;
            const stamp = `${k.slice(8)} ${e.time || ""}`;
            if (stamp > cur.last) { cur.last = stamp; cur.entry = e; }
            map[e.food_name] = cur;
          }));
        }
        return Object.values(map).sort((a, b) => b.count - a.count || (a.last < b.last ? 1 : -1)).slice(0, 30);
      };

      const addFromRecent = async (e) => {
        setError(null);
        await saveEntry({
          food_name: e.food_name,
          items: (e.items || []).map((it) => ({ ...it })),
          confidence: e.confidence,
          notes: "從吃過的紀錄再記一次",
        }, e.thumb);
      };

      const deleteEntry = async (mealId, entryId) => {
        const next = { ...dayLog, [mealId]: (dayLog[mealId] || []).filter((e) => e.id !== entryId) };
        await persist(next);
      };

      // ---------- 調整份量 ----------
      // 把一樣食材的克數與營養素等比例放大縮小
      const scaleItem = (it, f) => ({
        ...it,
        grams: round1((Number(it.grams) || 0) * f),
        calories: Math.round((Number(it.calories) || 0) * f),
        carbs_g: round1((Number(it.carbs_g) || 0) * f),
        protein_g: round1((Number(it.protein_g) || 0) * f),
        fat_g: round1((Number(it.fat_g) || 0) * f),
      });

      // 改一筆紀錄後存檔（persist 會一併同步到雲端）
      const updateEntry = async (mealId, entryId, fn) => {
        const next = {
          ...dayLog,
          [mealId]: (dayLog[mealId] || []).map((e) => (e.id === entryId ? fn(e) : e)),
        };
        await persist(next);
      };

      // 整份調整：一律從 AI 原始估算（baseItems）換算，按幾次都不會越算越偏
      const setPortion = (mealId, entryId, f) =>
        updateEntry(mealId, entryId, (x) => {
          const base = x.baseItems || x.items || [];
          return { ...x, baseItems: base, portion: f, items: base.map((it) => scaleItem(it, f)) };
        });

      // 單樣食材改克數：依新舊克數比例換算這一樣的營養素
      const setItemGrams = (mealId, entryId, idx, value) =>
        updateEntry(mealId, entryId, (x) => {
          const cur = (x.items || [])[idx];
          const g = Number(value);
          if (!cur || !(g >= 0) || !(Number(cur.grams) > 0) || g === Number(cur.grams)) return x;
          const items = x.items.map((it, i) => (i === idx ? scaleItem(it, g / Number(cur.grams)) : it));
          return { ...x, baseItems: x.baseItems || x.items, portion: null, items };
        });

      const PORTIONS = [
        [0.25, "¼"], [0.5, "½"], [0.75, "¾"], [1, "1 份"], [1.5, "1.5"], [2, "2 份"],
      ];

      // 甜度：台灣手搖飲的分級，全糖以每 100 ml 約 8 g 糖估
      const SWEETNESS = [[0, "無糖"], [0.3, "微糖"], [0.5, "半糖"], [0.7, "少糖"], [1, "全糖"]];
      const SUGAR_PER_100ML = 8;
      // 認得出來的「糖」項目（珍珠、粉圓這類配料不算）
      const isSugarItem = (it) => /(果糖|砂糖|蔗糖|糖漿|糖水|^糖)/.test(it.name || "") && !/珍珠|粉圓|波霸/.test(it.name || "");
      const hasLiquid = (items) => (items || []).some((it) => it.unit === "ml");

      // 把糖拆成獨立一項：先拿掉原本的糖，再依液體毫升數與甜度補一項
      const withSweetness = (items, level) => {
        const rest = (items || []).filter((it) => !isSugarItem(it));
        const ml = rest.filter((it) => it.unit === "ml").reduce((s, it) => s + (Number(it.grams) || 0), 0) || 500;
        const sugar = Math.round(ml / 100 * SUGAR_PER_100ML * level);
        if (sugar <= 0) return rest;
        const label = (SWEETNESS.find(([v]) => v === level) || [0, ""])[1];
        return [...rest, {
          emoji: "🍬", name: `糖（${label}）`, grams: sugar, unit: "g",
          calories: sugar * 4, carbs_g: sugar, protein_g: 0, fat_g: 0,
        }];
      };

      // 已記錄的飲料改甜度；改完把目前內容當成新的原始份量
      const setSweetness = (mealId, entryId, level) =>
        updateEntry(mealId, entryId, (x) => {
          const items = withSweetness(x.items, level);
          return { ...x, items, baseItems: items, portion: 1, sweet: level };
        });

      const openCapture = (mealId) => {
        setActiveMeal(mealId);
        setView("capture");
        setImageData(null);
        setPreviewUrl(null);
        setThumb(null);
        setResult(null);
        setSaved(false);
        setError(null);
        setManualTab(null);
        setPickedFood(null);
        setFoodQuery("");
        setTextDesc("");
      };

      // ---------- 樣式 ----------
      const btnStyle = {
        background: T.orange, color: "#FFF", fontWeight: 800,
        borderRadius: 999, boxShadow: "0 3px 0 rgba(74,52,42,0.25)",
      };
      const btnOutline = {
        background: T.card, color: T.brown, fontWeight: 800,
        borderRadius: 999, border: `2px solid ${T.brown}`,
      };
      const cardStyle = {
        background: T.card, borderRadius: 24, boxShadow: "0 4px 14px rgba(74,52,42,0.10)",
      };
      const fontFamily =
        'ui-rounded, "Hiragino Maru Gothic ProN", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif';

      const confidenceLabel = {
        high: "估算可信度:高",
        medium: "估算可信度:中",
        low: "估算可信度:低,僅供粗略參考",
      };

      // ============ 設定頁(API 金鑰) ============
      if (view === "settings") {
        return (
          <div className="min-h-screen w-full flex flex-col items-center px-4 py-6"
            style={{ background: T.bg, color: T.brown, fontFamily }}>
            <div className="w-full max-w-md">
              <div className="flex items-center gap-3 mb-4">
                <button onClick={() => setView("diary")} className="px-4 py-2 text-sm" style={btnOutline}>
                  ← 返回
                </button>
                <div className="text-lg" style={{ fontWeight: 900 }}>⚙️ 設定</div>
              </div>

              <div className="w-full p-5" style={cardStyle}>
                <div className="text-base mb-2" style={{ fontWeight: 900 }}>Anthropic API 金鑰</div>
                <div className="text-xs mb-4" style={{ color: T.lightBrown, lineHeight: 1.7 }}>
                  照片分析功能需要你自己的 API 金鑰。金鑰只會儲存在你這台手機的瀏覽器裡,
                  不會上傳到任何其他地方。到 console.anthropic.com 可以申請
                  (依用量計費,分析一張照片的費用約新台幣 0.3 元上下)。
                </div>

                {apiKey ? (
                  <div>
                    <div className="mb-3 px-3 py-2 text-sm"
                      style={{ background: "#EDF5EC", color: T.green, borderRadius: 12, fontWeight: 800 }}>
                      ✓ 已設定金鑰(sk-...{apiKey.slice(-4)})
                    </div>
                    <button onClick={clearApiKey} className="px-5 py-2 text-sm"
                      style={{ ...btnOutline, border: `2px solid ${T.red}`, color: T.red }}>
                      移除金鑰
                    </button>
                  </div>
                ) : (
                  <div>
                    <input
                      type="password"
                      value={keyInput}
                      onChange={(e) => setKeyInput(e.target.value)}
                      placeholder="sk-ant-..."
                      className="w-full px-4 py-3 mb-3 text-sm"
                      style={{
                        borderRadius: 12, border: `2px solid ${T.track}`,
                        background: T.bg, color: T.brown, outline: "none",
                      }}
                    />
                    <button onClick={saveApiKey} className="w-full py-3 text-base" style={btnStyle}>
                      儲存金鑰
                    </button>
                  </div>
                )}
              </div>

              <div className="text-xs mt-4 px-2" style={{ color: T.lightBrown, lineHeight: 1.7 }}>
                沒有金鑰也可以使用日記與月曆功能,只是無法用照片自動分析。
              </div>

              {/* 身體資料：首頁選「目標」時用來計算 */}
              <div className="w-full p-5 mt-4" style={cardStyle}>
                <div className="text-base mb-2" style={{ fontWeight: 900 }}>身體資料</div>
                <div className="text-xs mb-3" style={{ color: T.lightBrown, lineHeight: 1.7 }}>
                  首頁選「目標」和「今天」時,會用這裡的體重和體脂率計算熱量與營養素。量了新的數字記得回來改。
                  體脂率不知道可以留空。
                </div>
                {[["weight", "體重(公斤)"], ["bf", "體脂率(%)"]].map(([k, label]) => (
                  <div key={k} className="flex items-center justify-between mb-2">
                    <span className="text-sm" style={{ fontWeight: 700 }}>{label}</span>
                    <input type="number" inputMode="decimal" value={bodyInput[k]}
                      onChange={(e) => setBodyInput({ ...bodyInput, [k]: e.target.value })}
                      aria-label={label} className="px-3 py-2 text-sm text-right"
                      style={{ width: 110, borderRadius: 12, border: `2px solid ${T.track}`, background: T.bg, color: T.brown, outline: "none" }} />
                  </div>
                ))}
                <button onClick={saveBody} className="w-full py-3 mt-2 text-base" style={btnStyle}>
                  儲存並重算目標
                </button>
              </div>

              {/* 每日營養目標 */}
              <div className="w-full p-5 mt-4" style={cardStyle}>
                <div className="text-base mb-2" style={{ fontWeight: 900 }}>每日營養目標</div>
                <div className="text-xs mb-3" style={{ color: T.lightBrown, lineHeight: 1.7 }}>
                  首頁的圓環會依這裡的目標計算。蛋白質建議每公斤體重 1.6～2 克。
                  有開雲端同步時，教練推送的今日目標會自動覆蓋這裡的數字。
                </div>
                {[
                  ["kcal", "🔥 熱量(大卡)"],
                  ["carbs", "🍞 碳水(克)"],
                  ["protein", "🍗 蛋白質(克)"],
                  ["fat", "🥑 脂肪(克)"],
                ].map(([k, label]) => (
                  <div key={k} className="flex items-center justify-between mb-2">
                    <span className="text-sm" style={{ fontWeight: 700 }}>{label}</span>
                    <input
                      type="number"
                      inputMode="numeric"
                      value={goalInput[k]}
                      onChange={(e) => setGoalInput({ ...goalInput, [k]: e.target.value })}
                      className="px-3 py-2 text-sm text-right"
                      style={{
                        width: 110, borderRadius: 12, border: `2px solid ${T.track}`,
                        background: T.bg, color: T.brown, outline: "none",
                      }}
                    />
                  </div>
                ))}
                <button onClick={saveGoals} className="w-full py-3 mt-2 text-base" style={btnStyle}>
                  儲存目標
                </button>
              </div>

              {/* 雲端同步(選填) */}
              <div className="w-full p-5 mt-4" style={cardStyle}>
                <div className="text-base mb-2" style={{ fontWeight: 900 }}>雲端同步(選填)</div>
                <div className="text-xs mb-4" style={{ color: T.lightBrown, lineHeight: 1.7 }}>
                  填入自己的 Google 試算表同步網址後,每次新增或刪除紀錄都會自動備份到試算表。
                  不填就完全不會上傳任何資料。
                </div>
                {syncUrl ? (
                  <div>
                    <div className="mb-3 px-3 py-2 text-sm"
                      style={{ background: "#EDF5EC", color: T.green, borderRadius: 12, fontWeight: 800 }}>
                      ✓ 已開啟同步
                    </div>
                    <div className="flex gap-2 mb-2">
                      <button onClick={testSync} className="flex-1 py-2 text-sm" style={btnOutline}>
                        測試連線
                      </button>
                      <button onClick={backfillSync} className="flex-1 py-2 text-sm" style={btnOutline}>
                        補傳舊紀錄
                      </button>
                    </div>
                    {syncMsg && (
                      <div className="text-sm mb-2" style={{ color: T.brown, fontWeight: 700 }}>{syncMsg}</div>
                    )}
                    <div className="text-xs mb-3" style={{ color: T.lightBrown, lineHeight: 1.7 }}>
                      {syncStatus
                        ? `最後一次上傳:${syncStatus.time} ${syncStatus.ok ? "✓" : "✗"} ${syncStatus.msg}`
                        : "這台手機還沒上傳過"}
                      {pending.length > 0 && `;待補送 ${pending.length} 天`}
                    </div>
                    <button onClick={clearSyncUrl} className="px-5 py-2 text-sm"
                      style={{ ...btnOutline, border: `2px solid ${T.red}`, color: T.red }}>
                      關閉同步
                    </button>
                  </div>
                ) : (
                  <div>
                    <input
                      type="url"
                      value={syncInput}
                      onChange={(e) => setSyncInput(e.target.value)}
                      placeholder="https://script.google.com/macros/s/.../exec?key=..."
                      className="w-full px-4 py-3 mb-3 text-sm"
                      style={{
                        borderRadius: 12, border: `2px solid ${T.track}`,
                        background: T.bg, color: T.brown, outline: "none",
                      }}
                    />
                    <button onClick={saveSyncUrl} className="w-full py-3 text-base" style={btnStyle}>
                      開啟同步
                    </button>
                    {syncMsg && (
                      <div className="text-sm mt-2" style={{ color: T.red, fontWeight: 700 }}>{syncMsg}</div>
                    )}
                  </div>
                )}
              </div>
            </div>
          </div>
        );
      }

      // ============ 月曆頁 ============
      if (view === "calendar") {
        const y = calMonth.getFullYear();
        const m = calMonth.getMonth();
        const firstOffset = (new Date(y, m, 1).getDay() + 6) % 7; // 週一起始
        const daysInMonth = new Date(y, m + 1, 0).getDate();
        const cells = [];
        for (let i = 0; i < firstOffset; i++) cells.push(null);
        for (let d = 1; d <= daysInMonth; d++) cells.push(d);
        const monthCal = Object.entries(summary)
          .filter(([k]) => k.startsWith(`${y}-${pad2(m + 1)}-`))
          .reduce((a, [, v]) => a + v, 0);

        return (
          <div className="min-h-screen w-full flex flex-col items-center px-4 py-6"
            style={{ background: T.bg, color: T.brown, fontFamily }}>
            <div className="w-full max-w-md">
              <div className="flex items-center gap-3 mb-4">
                <button onClick={() => setView("diary")} className="px-4 py-2 text-sm" style={btnOutline}>
                  ← 返回
                </button>
                <div className="text-lg" style={{ fontWeight: 900 }}>📅 飲食月曆</div>
              </div>

              <div className="w-full p-4" style={cardStyle}>
                {/* 月份切換 */}
                <div className="flex items-center justify-between mb-3">
                  <button onClick={() => setCalMonth(new Date(y, m - 1, 1))}
                    className="px-3 py-1" style={{ ...btnOutline, border: `2px solid ${T.track}` }}>‹</button>
                  <div style={{ fontWeight: 900 }}>{y} 年 {m + 1} 月</div>
                  <button onClick={() => setCalMonth(new Date(y, m + 1, 1))}
                    className="px-3 py-1" style={{ ...btnOutline, border: `2px solid ${T.track}` }}>›</button>
                </div>

                {/* 星期列 */}
                <div className="grid grid-cols-7 mb-1">
                  {WEEKDAYS.map((w) => (
                    <div key={w} className="text-center text-xs py-1"
                      style={{ color: T.lightBrown, fontWeight: 700 }}>{w}</div>
                  ))}
                </div>

                {/* 日期格 */}
                <div className="grid grid-cols-7">
                  {cells.map((d, idx) => {
                    if (d === null) return <div key={`e${idx}`} />;
                    const ds = `${y}-${pad2(m + 1)}-${pad2(d)}`;
                    const kcal = summary[ds];
                    const today = ds === todayStr();
                    const over = kcal > DAILY_GOAL;
                    return (
                      <button
                        key={ds}
                        onClick={() => { setSelectedDate(ds); setView("diary"); }}
                        className="flex flex-col items-center py-1"
                        style={{ borderRadius: 12, background: today ? T.track : "transparent" }}
                      >
                        <div
                          className="flex items-center justify-center"
                          style={{
                            width: 30, height: 30, borderRadius: 999,
                            background: today ? T.orange : "transparent",
                            color: today ? "#FFF" : T.brown,
                            fontWeight: today ? 900 : 700, fontSize: 14,
                          }}
                        >
                          {d}
                        </div>
                        <div className="text-xs" style={{
                          minHeight: 16,
                          color: kcal ? (over ? T.red : T.green) : "transparent",
                          fontWeight: 800, fontSize: 10,
                        }}>
                          {kcal || "·"}
                        </div>
                      </button>
                    );
                  })}
                </div>

                <div className="mt-3 pt-3 flex justify-between text-xs"
                  style={{ borderTop: `1px solid ${T.track}`, color: T.lightBrown }}>
                  <span>本月累計:<span style={{ color: T.brown, fontWeight: 900 }}>{monthCal}</span> 大卡</span>
                  <span>
                    <span style={{ color: T.green, fontWeight: 800 }}>綠</span>=未超標
                    <span className="ml-2" style={{ color: T.red, fontWeight: 800 }}>紅</span>=超過 {DAILY_GOAL}
                  </span>
                </div>
              </div>

              <div className="text-center mt-4">
                <button
                  onClick={() => { setSelectedDate(todayStr()); setView("diary"); }}
                  className="px-6 py-2 text-sm" style={btnStyle}>
                  回到今天
                </button>
              </div>
            </div>
          </div>
        );
      }

      // ============ 拍照/分析頁 ============
      if (view === "capture") {
        const meal = MEALS.find((mm) => mm.id === activeMeal);
        const totals = result ? sumItems(result.items) : null;
        const macroCal = totals ? totals.carbs * 4 + totals.protein * 4 + totals.fat * 9 || 1 : 1;
        return (
          <div className="min-h-screen w-full flex flex-col items-center px-4 py-6"
            style={{ background: T.bg, color: T.brown, fontFamily }}>
            <div className="w-full max-w-md">
              <div className="flex items-center gap-3 mb-4">
                <button onClick={() => setView("diary")} className="px-4 py-2 text-sm" style={btnOutline}>
                  ← 返回
                </button>
                <div className="text-lg" style={{ fontWeight: 900 }}>
                  記錄到:{meal ? `${meal.icon} ${meal.label}` : ""}
                  {!isToday && <span className="text-xs ml-1" style={{ color: T.lightBrown }}>({selectedDate})</span>}
                </div>
              </div>

              {!apiKey && (
                <div className="p-4 mb-4 text-sm"
                  style={{ background: T.card, borderRadius: 16, borderLeft: `6px solid ${T.yellow}` }}>
                  尚未設定 API 金鑰,無法使用照片分析。
                  <button onClick={() => setView("settings")}
                    className="ml-2 text-sm" style={{ color: T.orange, fontWeight: 800 }}>
                    前往設定 →
                  </button>
                </div>
              )}

              <div className="w-full mb-4 overflow-hidden" style={cardStyle}>
                {previewUrl ? (
                  <img src={previewUrl} alt="食物照片預覽" className="w-full object-cover" style={{ maxHeight: 300 }} />
                ) : (
                  <div className="w-full py-12 flex flex-col items-center gap-4">
                    {converting ? (
                      <span className="text-sm" style={{ color: T.lightBrown }}>照片處理中…</span>
                    ) : (
                      <React.Fragment>
                        <button onClick={() => cameraRef.current && cameraRef.current.click()}
                          className="px-10 py-3 text-base" style={btnStyle}>📷 拍照</button>
                        <button onClick={() => galleryRef.current && galleryRef.current.click()}
                          className="px-10 py-3 text-base" style={btnOutline}>🖼️ 從圖庫選照片</button>
                      </React.Fragment>
                    )}
                  </div>
                )}
                <input ref={cameraRef} type="file" accept="image/*" capture="environment" className="hidden"
                  onChange={(e) => { const f = e.target.files && e.target.files[0]; if (f) processFile(f); }} />
                <input ref={galleryRef} type="file" accept="image/*" className="hidden"
                  onChange={(e) => { const f = e.target.files && e.target.files[0]; if (f) processFile(f); }} />
              </div>

              {/* 沒拍到照片：資料庫、吃過的、打字讓 AI 估 */}
              {!previewUrl && !saved && (
                <div className="w-full p-4 mb-4" style={cardStyle}>
                  <div className="text-sm mb-3" style={{ fontWeight: 900 }}>沒拍到照片？</div>
                  <div className="flex gap-2 mb-3">
                    {[["db", "🔎 食物資料庫"], ["recent", "🕘 吃過的"], ["text", "✍️ 打字描述"]].map(([k, label]) => (
                      <button key={k}
                        onClick={() => { setManualTab(k); setError(null); if (k === "db") loadFoodDb(); }}
                        className="flex-1 py-2 text-xs"
                        style={manualTab === k ? { ...btnStyle, boxShadow: "none" } : btnOutline}>
                        {label}
                      </button>
                    ))}
                  </div>

                  {manualTab === "db" && (
                    <div>
                      {!pickedFood ? (
                        <React.Fragment>
                          <input
                            value={foodQuery} onChange={(e) => setFoodQuery(e.target.value)}
                            placeholder="輸入食物名稱,例如:白飯、雞胸、香蕉"
                            className="w-full px-3 py-2 mb-2 text-sm"
                            style={{ borderRadius: 12, border: `2px solid ${T.track}`, background: T.bg, color: T.brown, outline: "none" }}
                          />
                          {!foodDb && <div className="text-xs" style={{ color: T.lightBrown }}>資料庫載入中…</div>}
                          {foodDb && foodQuery.trim() && searchFoods(foodQuery).length === 0 && (
                            <div className="text-xs mb-2" style={{ color: T.lightBrown }}>
                              資料庫只有一般食材,沒有連鎖店或品牌餐點。
                            </div>
                          )}
                          {/* 找不到、或想直接估連鎖店餐點：帶著打的字切到打字描述 */}
                          {foodQuery.trim() && (
                            <button
                              onClick={() => { setTextDesc(foodQuery.trim()); setManualTab("text"); }}
                              className="w-full py-2 mb-2 text-sm" style={btnOutline}>
                              ✍️ 用 AI 估算「{foodQuery.trim()}」
                            </button>
                          )}
                          <div style={{ maxHeight: 320, overflowY: "auto" }}>
                            {searchFoods(foodQuery).map((f, i) => (
                              <button key={i} onClick={() => pickFood(f)}
                                className="w-full text-left py-2 px-1"
                                style={{ borderBottom: `1px solid ${T.track}` }}>
                                <div className="text-sm" style={{ fontWeight: 800 }}>{f[0]}
                                  {f[1] && <span className="text-xs ml-1" style={{ color: T.lightBrown, fontWeight: 400 }}>({f[1]})</span>}
                                </div>
                                <div className="text-xs" style={{ color: T.lightBrown }}>
                                  {f[3] && `${f[3].slice(0, 24)}・`}每100g 🔥{Math.round(f[4])} 🍞{f[5]} 🍗{f[6]} 🥑{f[7]}
                                </div>
                              </button>
                            ))}
                          </div>
                          {foodDb && (
                            <div className="text-xs mt-2" style={{ color: T.lightBrown }}>
                              資料來源:衛生福利部食品藥物管理署 食品營養成分資料庫
                            </div>
                          )}
                        </React.Fragment>
                      ) : (
                        <div>
                          <div className="text-sm mb-1" style={{ fontWeight: 900 }}>{pickedFood[0]}</div>
                          <div className="text-xs mb-3" style={{ color: T.lightBrown }}>{pickedFood[3]}</div>
                          <div className="flex items-center gap-2 mb-2">
                            <span className="text-sm" style={{ fontWeight: 700 }}>份量</span>
                            <input type="number" inputMode="decimal" value={pickAmount}
                              onChange={(e) => setPickAmount(e.target.value)}
                              aria-label="份量數量"
                              className="px-3 py-2 text-sm text-right"
                              style={{ width: 80, borderRadius: 12, border: `2px solid ${T.track}`, background: T.bg, color: T.brown, outline: "none" }} />
                            <select value={pickUnit} onChange={(e) => setPickUnit(e.target.value)}
                              aria-label="單位"
                              className="px-2 py-2 text-sm"
                              style={{ borderRadius: 12, border: `2px solid ${T.track}`, background: T.bg, color: T.brown, outline: "none" }}>
                              {unitsFor(pickedFood).map((u) => <option key={u.k} value={u.k}>{u.label}</option>)}
                            </select>
                          </div>
                          {pickResult() && pickResult().unit === "ml" && (
                            <div className="flex items-center gap-1 mb-2 flex-wrap">
                              <span className="text-sm mr-1" style={{ fontWeight: 700 }}>甜度</span>
                              {SWEETNESS.map(([v, label]) => (
                                <button key={v} onClick={() => setPickSweet(v)} className="text-xs px-2 py-1"
                                  style={{
                                    borderRadius: 999, fontWeight: 800,
                                    background: pickSweet === v ? T.orange : T.card,
                                    color: pickSweet === v ? "#FFF" : T.brown,
                                    border: `2px solid ${pickSweet === v ? T.orange : T.track}`,
                                  }}>{label}</button>
                              ))}
                            </div>
                          )}
                          {(() => {
                            const r = pickResult();
                            return r && (
                              <div className="text-sm mb-3" style={{ fontVariantNumeric: "tabular-nums" }}>
                                <span style={{ color: T.lightBrown }}>{r.shown} {r.unit}・</span>
                                🔥{r.kcal} 大卡　🍞{r.carbs}　🍗{r.protein}　🥑{r.fat}
                              </div>
                            );
                          })()}
                          <div className="flex gap-2">
                            <button onClick={addFromDb} className="flex-1 py-3 text-base" style={btnStyle}>加入紀錄</button>
                            <button onClick={() => setPickedFood(null)} className="px-4 py-3" style={btnOutline}>重選</button>
                          </div>
                        </div>
                      )}
                    </div>
                  )}

                  {manualTab === "recent" && (() => {
                    const list = recentFoods();
                    return list.length === 0 ? (
                      <div className="text-xs" style={{ color: T.lightBrown }}>還沒有紀錄。</div>
                    ) : (
                      <div style={{ maxHeight: 360, overflowY: "auto" }}>
                        {list.map(({ entry, count }) => {
                          const s = sumItems(entry.items);
                          return (
                            <button key={entry.food_name} onClick={() => addFromRecent(entry)}
                              className="w-full text-left py-2 px-1 flex items-center gap-2"
                              style={{ borderBottom: `1px solid ${T.track}` }}>
                              {entry.thumb ? (
                                <img src={entry.thumb} alt="" style={{ width: 36, height: 36, borderRadius: 10, objectFit: "cover" }} />
                              ) : (
                                <div style={{ width: 36, height: 36, borderRadius: 10, background: T.track }} />
                              )}
                              <div className="flex-1">
                                <div className="text-sm" style={{ fontWeight: 800 }}>{entry.food_name}</div>
                                <div className="text-xs" style={{ color: T.lightBrown }}>
                                  吃過 {count} 次・🔥{Math.round(s.cal)} 🍞{round1(s.carbs)} 🍗{round1(s.protein)} 🥑{round1(s.fat)}
                                </div>
                              </div>
                              <span className="text-xs" style={{ color: T.orange, fontWeight: 800 }}>＋記一筆</span>
                            </button>
                          );
                        })}
                      </div>
                    );
                  })()}

                  {manualTab === "text" && (
                    <div>
                      <textarea value={textDesc} onChange={(e) => setTextDesc(e.target.value)} rows={3}
                        placeholder="例如:麥味登雞肉鬆餅堡、350ml 鮮奶茶半糖"
                        className="w-full px-3 py-2 mb-2 text-sm"
                        style={{ borderRadius: 12, border: `2px solid ${T.track}`, background: T.bg, color: T.brown, outline: "none" }} />
                      <button onClick={analyzeText} disabled={loading || !textDesc.trim()} className="w-full py-3 text-base"
                        style={{ ...btnStyle, background: loading ? T.lightBrown : T.orange }}>
                        {loading ? "估算中…" : "✍️ 讓 AI 估算並記錄"}
                      </button>
                      <div className="text-xs mt-2" style={{ color: T.lightBrown }}>
                        跟拍照一樣使用你的 API 金鑰,只送文字所以更便宜。寫越清楚(品牌、容量、甜度)越準。
                      </div>
                    </div>
                  )}
                </div>
              )}

              {previewUrl && !saved && (
                <div className="flex gap-2 mb-4">
                  <button onClick={analyze} disabled={loading} className="flex-1 py-3 text-base"
                    style={{ ...btnStyle, background: loading ? T.lightBrown : T.orange }}>
                    {loading ? "分析中…" : "🔥 分析並記錄"}
                  </button>
                  <button onClick={() => cameraRef.current && cameraRef.current.click()}
                    disabled={loading} className="px-4 py-3" style={btnOutline}>重拍</button>
                  <button onClick={() => galleryRef.current && galleryRef.current.click()}
                    disabled={loading} className="px-4 py-3" style={btnOutline}>圖庫</button>
                </div>
              )}

              {error && (
                <div className="p-4 mb-4 text-sm"
                  style={{ background: T.card, borderRadius: 16, borderLeft: `6px solid ${T.red}` }}>
                  {error}
                </div>
              )}

              {result && totals && (
                <div className="w-full p-5 mb-4" style={cardStyle}>
                  {saved && (
                    <div className="mb-3 px-3 py-2 text-sm"
                      style={{ background: "#EDF5EC", color: T.green, borderRadius: 12, fontWeight: 800 }}>
                      ✓ 已加入{meal ? meal.label : ""}紀錄
                    </div>
                  )}
                  <div className="text-lg mb-4" style={{ fontWeight: 900 }}>🍽️ {result.food_name}</div>
                  <div className="flex justify-between mb-5">
                    <Donut value={totals.cal} fraction={totals.cal / DAILY_GOAL} label="🔥 熱量" color={T.orange} />
                    <Donut value={totals.carbs} fraction={(totals.carbs * 4) / macroCal} label="🍞 碳水" color={T.teal} />
                    <Donut value={totals.protein} fraction={(totals.protein * 4) / macroCal} label="🍗 蛋白" color={T.yellow} />
                    <Donut value={totals.fat} fraction={(totals.fat * 9) / macroCal} label="🥑 脂肪" color={T.red} />
                  </div>
                  <div className="flex items-center gap-2 mb-2">
                    <div style={{ flex: 1, height: 1, background: T.track }} />
                    <span className="text-xs" style={{ color: T.lightBrown, fontWeight: 700 }}>食材配方</span>
                    <div style={{ flex: 1, height: 1, background: T.track }} />
                  </div>
                  {(result.items || []).map((it, idx) => (
                    <div key={idx} className="flex items-center justify-between py-2"
                      style={{ borderBottom: idx < result.items.length - 1 ? `1px solid ${T.track}` : "none" }}>
                      <div className="flex items-baseline gap-1">
                        <span>{it.emoji}</span>
                        <span style={{ fontWeight: 800 }}>{it.name}</span>
                        <span className="text-xs" style={{ color: T.lightBrown }}>{round1(it.grams)}{it.unit === "ml" ? "ml" : "g"}</span>
                      </div>
                      <div className="text-xs" style={{ fontVariantNumeric: "tabular-nums" }}>
                        🔥{Math.round(it.calories) || 0} 🍞{round1(it.carbs_g)} 🍗{round1(it.protein_g)} 🥑{round1(it.fat_g)}
                      </div>
                    </div>
                  ))}
                  <div className="mt-4 text-xs" style={{ color: T.lightBrown }}>
                    {confidenceLabel[result.confidence] || ""}
                  </div>
                  {result.notes && <div className="mt-1 text-xs" style={{ color: T.lightBrown }}>{result.notes}</div>}
                </div>
              )}

              {saved && (
                <div className="flex gap-2">
                  <button onClick={() => setView("diary")} className="flex-1 py-3 text-base" style={btnStyle}>
                    ✓ 返回日記（可調份量）
                  </button>
                  <button onClick={() => openCapture(activeMeal)} className="px-4 py-3" style={btnOutline}>
                    再記一筆
                  </button>
                </div>
              )}
            </div>
          </div>
        );
      }

      // ============ 日記首頁 ============
      const allEntries = MEALS.flatMap((m) => dayLog[m.id] || []);
      const dayTotals = sumItems(allEntries.flatMap((e) => e.items || []));
      const remaining = Math.max(0, DAILY_GOAL - dayTotals.cal);

      return (
        <div className="min-h-screen w-full flex flex-col items-center px-4 py-6"
          style={{ background: T.bg, color: T.brown, fontFamily }}>
          <div className="w-full max-w-md">
            <header className="mb-4">
              <div className="flex items-center justify-between">
                <h1 className="text-2xl" style={{ fontWeight: 900 }}>拍照看營養</h1>
                <div className="flex gap-2">
                  <button onClick={() => setView("settings")}
                    className="px-3 py-2 text-sm" style={btnOutline} aria-label="設定">
                    ⚙️
                  </button>
                  <button onClick={() => {
                    const d = new Date(selectedDate);
                    setCalMonth(new Date(d.getFullYear(), d.getMonth(), 1));
                    setView("calendar");
                  }}
                    className="px-4 py-2 text-sm" style={btnOutline}>
                    📅 月曆
                  </button>
                </div>
              </div>
              <div className="flex items-center gap-2 mt-1">
                <span className="text-sm" style={{ color: T.orange, fontWeight: 800 }}>
                  {selectedDate} 飲食日記{isToday ? "(今天)" : ""}
                </span>
                {!isToday && (
                  <button onClick={() => setSelectedDate(todayStr())}
                    className="text-xs px-3 py-1" style={{ ...btnOutline, border: `2px solid ${T.orange}`, color: T.orange }}>
                    回今天
                  </button>
                )}
              </div>
            </header>

            {/* 當日總覽 */}
            <div className="w-full p-4 mb-4" style={cardStyle}>
              <div className="flex justify-between items-center mb-3">
                <span style={{ fontWeight: 900 }}>
                  當日總覽
                  {goalLabel && (
                    <span className="text-xs ml-2" style={{ color: T.orange, fontWeight: 800 }}>目標：{goalLabel}</span>
                  )}
                </span>
                <span className="text-sm" style={{ color: T.lightBrown }}>
                  剩餘 <span style={{ color: T.orange, fontWeight: 900 }}>{Math.round(remaining)}</span> / {DAILY_GOAL} 大卡
                </span>
              </div>
              <div className="flex justify-between">
                <Donut value={dayTotals.cal} fraction={dayTotals.cal / DAILY_GOAL} label="🔥 熱量" color={T.orange} />
                <Donut value={dayTotals.carbs} fraction={dayTotals.carbs / goals.carbs} label="🍞 碳水" color={T.teal} />
                <Donut value={dayTotals.protein} fraction={dayTotals.protein / goals.protein} label="🍗 蛋白" color={T.yellow} />
                <Donut value={dayTotals.fat} fraction={dayTotals.fat / goals.fat} label="🥑 脂肪" color={T.red} />
              </div>

              {/* 目標與今天的訓練：一選就重算 */}
              <div className="flex items-center gap-2 mt-3 pt-3 flex-wrap" style={{ borderTop: `1px solid ${T.track}` }}>
                <span className="text-xs" style={{ color: T.lightBrown, fontWeight: 700 }}>目標</span>
                <select value={plan.goal} onChange={(e) => applyPlan({ ...plan, goal: e.target.value })}
                  aria-label="目標" className="text-sm px-2 py-1"
                  style={{ borderRadius: 10, border: `2px solid ${T.track}`, background: T.bg, color: T.brown }}>
                  {Object.keys(PLAN_GOALS).map((g) => <option key={g} value={g}>{g}</option>)}
                </select>
                <span className="text-xs ml-1" style={{ color: T.lightBrown, fontWeight: 700 }}>今天</span>
                <select value={plan.day} onChange={(e) => applyPlan({ ...plan, day: e.target.value })}
                  aria-label="今天的訓練" className="text-sm px-2 py-1"
                  style={{ borderRadius: 10, border: `2px solid ${T.track}`, background: T.bg, color: T.brown }}>
                  {Object.keys(PLAN_ACTIVITY).map((d) => <option key={d} value={d}>{d}</option>)}
                </select>
                {plan.day === "騎車" && (
                  <React.Fragment>
                    <input type="number" inputMode="decimal" value={plan.hours} min="0.5" step="0.5"
                      onChange={(e) => applyPlan({ ...plan, hours: e.target.value })}
                      aria-label="騎車時數" className="text-sm px-2 py-1 text-right"
                      style={{ width: 52, borderRadius: 10, border: `2px solid ${T.track}`, background: T.bg, color: T.brown }} />
                    <span className="text-xs" style={{ color: T.lightBrown }}>小時</span>
                  </React.Fragment>
                )}
              </div>
              {syncUrl && pending.length > 0 && !flushing.current && (
                <div className="text-xs mt-2" style={{ color: T.red, fontWeight: 700 }}>
                  ⚠ 有 {pending.length} 天的紀錄還沒同步,連上網路後打開 App 會自動補送
                </div>
              )}
              {planMsg && (
                <div className="text-xs mt-2" style={{ color: T.red, fontWeight: 700 }}>{planMsg}</div>
              )}
            </div>

            {/* 四餐卡片 */}
            {MEALS.map((m) => {
              const entries = dayLog[m.id] || [];
              const mealCal = Math.round(sumItems(entries.flatMap((e) => e.items || [])).cal);
              return (
                <div key={m.id} className="w-full mb-3 p-4" style={cardStyle}>
                  <div className="flex items-center justify-between">
                    <div className="flex items-center gap-2">
                      <span className="text-xl">{m.icon}</span>
                      <span className="text-lg" style={{ fontWeight: 900 }}>{m.label}</span>
                      {mealCal > 0 && (
                        <span className="text-xs" style={{ color: T.lightBrown }}>🔥 {mealCal} 大卡</span>
                      )}
                    </div>
                    <button onClick={() => openCapture(m.id)} aria-label={`記錄${m.label}`}
                      style={{
                        width: 40, height: 40, borderRadius: 999, background: T.orange,
                        color: "#FFF", fontSize: 22, fontWeight: 800, lineHeight: "40px",
                        boxShadow: "0 3px 0 rgba(74,52,42,0.25)",
                      }}>
                      +
                    </button>
                  </div>

                  {entries.map((e) => {
                    const t = sumItems(e.items);
                    const open = expandedId === e.id;
                    return (
                      <div key={e.id} className="mt-3 pt-3" style={{ borderTop: `1px solid ${T.track}` }}>
                        <div className="flex items-center gap-2"
                          onClick={() => setExpandedId(open ? null : e.id)}>
                          {e.thumb ? (
                            <img src={e.thumb} alt="" style={{ width: 44, height: 44, borderRadius: 12, objectFit: "cover" }} />
                          ) : (
                            <div style={{ width: 44, height: 44, borderRadius: 12, background: T.track }} />
                          )}
                          <div className="flex-1">
                            <div style={{ fontWeight: 800 }}>{e.food_name}</div>
                            <div className="text-xs" style={{ color: T.lightBrown }}>
                              {e.time} · 🔥{Math.round(t.cal)} 🍞{round1(t.carbs)} 🍗{round1(t.protein)} 🥑{round1(t.fat)}
                            </div>
                          </div>
                          <button
                            onClick={(ev) => { ev.stopPropagation(); deleteEntry(m.id, e.id); }}
                            aria-label="刪除這筆紀錄" className="text-sm px-2 py-1"
                            style={{ color: T.red, fontWeight: 800 }}>
                            刪除
                          </button>
                        </div>
                        {open && (
                          <div className="mt-2 pl-2">
                            {/* 整份調整：實際只吃了一部分、或吃了兩份 */}
                            <div className="flex items-center gap-1 mb-2 flex-wrap">
                              <span className="text-xs mr-1" style={{ color: T.lightBrown, fontWeight: 700 }}>份量</span>
                              {PORTIONS.map(([f, label]) => {
                                const active = (e.portion ?? (e.baseItems ? null : 1)) === f;
                                return (
                                  <button key={f} onClick={() => setPortion(m.id, e.id, f)}
                                    className="text-xs px-2 py-1"
                                    style={{
                                      borderRadius: 999, fontWeight: 800,
                                      background: active ? T.orange : T.card,
                                      color: active ? "#FFF" : T.brown,
                                      border: `2px solid ${active ? T.orange : T.track}`,
                                    }}>
                                    {label}
                                  </button>
                                );
                              })}
                            </div>
                            {hasLiquid(e.items) && (
                              <div className="flex items-center gap-1 mb-2 flex-wrap">
                                <span className="text-xs mr-1" style={{ color: T.lightBrown, fontWeight: 700 }}>甜度</span>
                                {SWEETNESS.map(([v, label]) => (
                                  <button key={v} onClick={() => setSweetness(m.id, e.id, v)}
                                    className="text-xs px-2 py-1"
                                    style={{
                                      borderRadius: 999, fontWeight: 800,
                                      background: e.sweet === v ? T.orange : T.card,
                                      color: e.sweet === v ? "#FFF" : T.brown,
                                      border: `2px solid ${e.sweet === v ? T.orange : T.track}`,
                                    }}>{label}</button>
                                ))}
                              </div>
                            )}
                            {(e.items || []).map((it, idx) => (
                              <div key={idx} className="flex justify-between items-center text-xs py-1">
                                <span className="flex items-center gap-1">
                                  {it.emoji} {it.name}
                                  {/* 單樣食材改克數，離開欄位才存 */}
                                  <input
                                    key={`${e.id}-${idx}-${it.grams}`}
                                    type="number" inputMode="decimal" defaultValue={round1(it.grams)}
                                    onBlur={(ev) => setItemGrams(m.id, e.id, idx, ev.target.value)}
                                    onKeyDown={(ev) => { if (ev.key === "Enter") ev.target.blur(); }}
                                    aria-label={`${it.name}的克數`}
                                    className="text-right"
                                    style={{
                                      width: 56, padding: "2px 4px", borderRadius: 8,
                                      border: `1px solid ${T.track}`, background: T.bg, color: T.brown,
                                    }}
                                  />
                                  <span style={{ color: T.lightBrown }}>{it.unit === "ml" ? "ml" : "g"}</span>
                                </span>
                                <span style={{ fontVariantNumeric: "tabular-nums" }}>
                                  🔥{Math.round(it.calories) || 0} 🍞{round1(it.carbs_g)} 🍗{round1(it.protein_g)} 🥑{round1(it.fat_g)}
                                </span>
                              </div>
                            ))}
                            <div className="text-xs mt-1" style={{ color: T.lightBrown }}>
                              點份量按鈕整份換算；或直接改某樣食材的克數。
                            </div>
                          </div>
                        )}
                      </div>
                    );
                  })}

                  {entries.length === 0 && (
                    <div className="mt-2 text-xs" style={{ color: T.lightBrown }}>
                      還沒有紀錄,點 + 拍照記錄
                    </div>
                  )}
                </div>
              );
            })}

            {error && (
              <div className="p-4 mt-2 text-sm"
                style={{ background: T.card, borderRadius: 16, borderLeft: `6px solid ${T.red}` }}>
                {error}
              </div>
            )}

            {!storageReady && (
              <div className="text-center text-xs mt-2" style={{ color: T.lightBrown }}>載入紀錄中…</div>
            )}

            <div className="text-center text-xs mt-4" style={{ color: T.lightBrown }}>
              ※ 數值為 AI 依照片估算,僅供參考。
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<FoodDiary />);
  </script>
</body>
</html>
